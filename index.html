<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js')
    .then(() => console.log('✅ SW registrado'))
    .catch(err => console.error('❌ SW erro', err));
}


/* ===== DETECÇÃO PWA ===== */
function isPWAInstalled() {
  return window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;
}

/* ===== INSTALL PROMPT ===== */
let deferredPrompt = null;
const installBanner = document.getElementById('installBanner');
const btnInstall = document.getElementById('btnInstall');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault(); // 🔴 OBRIGATÓRIO
  deferredPrompt = e;

  if (!isPWAInstalled()) {
    installBanner.style.display = 'flex';
  }
});

btnInstall.addEventListener('click', async () => {
  if (!deferredPrompt) return;

  deferredPrompt.prompt();
  await deferredPrompt.userChoice;

  deferredPrompt = null;
  installBanner.style.display = 'none';
});

window.addEventListener('appinstalled', () => {
  console.log('✅ App instalado');
  installBanner.style.display = 'none';
});

/* ===== GPS / ROTA ===== */
let rota=[],watchId=null,enviandoSaida=false,enviandoRetorno=false;

function iniciarGPS(){
  if(watchId) return;
  watchId=navigator.geolocation.watchPosition(p=>{
    rota.push({lat:p.coords.latitude,lon:p.coords.longitude,t:Date.now()});
    localStorage.setItem('rota',JSON.stringify(rota));
  },null,{enableHighAccuracy:true,maximumAge:0,timeout:10000});
}

window.onload=()=>{
  const agora=new Date();
  dataSaida.valueAsDate=agora;
  dataRetorno.valueAsDate=agora;

  if(localStorage.getItem('viagemAtiva')){
    rota=JSON.parse(localStorage.getItem('rota')||'[]');
    formSaida.style.display='none';
    formRetorno.style.display='block';
    status.style.display='block';
    iniciarGPS();
  }
};

/* ===== SAÍDA ===== */
formSaida.onsubmit=e=>{
  e.preventDefault();
  if(!isPWAInstalled()){
    alert('📲 Instale o app para iniciar a viagem');
    showInstallBanner();
    return;
  }
  if(enviandoSaida) return;
  enviandoSaida=true;btnSaida.disabled=true;

  rota=[];localStorage.setItem('rota','[]');

  navigator.geolocation.getCurrentPosition(p=>{
    google.script.run.registrarSaida({
      dataSaida:dataSaida.value,
      veiculo:veiculoSaida.value,
      motorista:motoristaSaida.value,
      destino:destinoSaida.value,
      horaSaida:horaSaida.value,
      hodometroSaida:hodometroSaida.value,
      localizacaoSaida:`${p.coords.latitude},${p.coords.longitude}`
    });
    localStorage.setItem('viagemAtiva',veiculoSaida.value);
    formSaida.style.display='none';
    formRetorno.style.display='block';
    status.style.display='block';
    iniciarGPS();
  });
};

/* ===== RETORNO ===== */
formRetorno.onsubmit=e=>{
  e.preventDefault();
  if(enviandoRetorno) return;
  enviandoRetorno=true;btnRetorno.disabled=true;

  navigator.geolocation.getCurrentPosition(p=>{
    google.script.run.registrarRetorno({
      veiculo:localStorage.getItem('viagemAtiva'),
      dataRetorno:dataRetorno.value,
      horaRetorno:horaRetorno.value,
      hodometroRetorno:hodometroRetorno.value,
      localizacaoRetorno:`${p.coords.latitude},${p.coords.longitude}`,
      historicoRota:JSON.stringify(JSON.parse(localStorage.getItem('rota')||'[]'))
    });
    localStorage.clear();
    location.reload();
  });

  
};


function mostrarRetorno() {
  secaoSaida.style.display = 'none';
  secaoRetorno.style.display = 'block';
  status.style.display = 'block';
}



function calcularDistancia(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const dLat = (lat2-lat1)*Math.PI/180;
        const dLon = (lon2-lon1)*Math.PI/180;
        const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
</script>
